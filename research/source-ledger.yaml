# ---------------------------------------------------------------------------
# C. Clinical sources for the v0 golden-test arc (skull-base chordoma -> particle therapy)
#    Used ONLY to ground the synthetic test; the test patient is fictional.
# ---------------------------------------------------------------------------
clinical_chordoma_arc:
  - id: esmo-bone-sarcoma-cpg
    org: ESMO-PaedCan-EURACAN
    title: Bone Sarcomas Clinical Practice Guidelines
    url: https://selnetconsortium.org/wp-content/uploads/2020/07/Bone-Sarcomas-Guidelines-ESMO.pdf
    confirms: >
      For chordoma, particle therapy (high-dose protons or carbon ions) "should ... be
      considered the treatment of choice [IV, B]"; chordoma management needs radiation
      oncologists with access to hadron facilities. Skull-base chondrosarcoma: high-dose RT
      incl. proton/carbon-ion, 80-90% local control.
    evidence_type: guideline
    strength: consensus-recommended (graded IV,B) — NOT RCT-proven
    source_version: "ESMO bone sarcoma CPG, Ann Oncol 2018 (Suppl 4)"
    confidence: high
    verified_at: 2026-06-19
  - id: chordoma-global-consensus
    org: Chordoma Global Consensus Group (ESMO + Chordoma Foundation)
    title: Consensus on chordoma management
    url: https://www.thelancet.com/journals/lanonc/article/PIIS1470-2045(14)71190-8/fulltext
    confirms: Surgery + high-dose RT (particle therapy as the means to reach curative dose) endorsed by international consensus.
    evidence_type: consensus
    strength: consensus-recommended
    source_version: "Lancet Oncology, 2015"
    confidence: medium     # full text paywalled to automated fetch; existence/thrust corroborated
    verified_at: 2026-06-19
  - id: nci-context
    org: NCI / RadioGraphics (RSNA)
    title: Skull-base chordoma management context
    url: https://pubs.rsna.org/doi/10.1148/rg.240036
    confirms: Surgery + high-dose post-op particle/proton RT described as standard of care; rationale = brainstem/optic sparing for a radioresistant tumour.
    evidence_type: review
    strength: review/standard-of-care description
    source_version: "RadioGraphics, 2024"
    confidence: medium
    verified_at: 2026-06-19

# ---------------------------------------------------------------------------
# C2. Clinical sources for the primary golden test (colorectal — common scenario)
#     Used ONLY to ground the synthetic test; the test patient is fictional.
# ---------------------------------------------------------------------------
clinical_colorectal:
  - id: crc-mmr-msi-universal
    org: NICE / ESMO / NCCN
    title: Universal MMR/MSI testing in colorectal cancer
    url: https://www.nice.org.uk/guidance/qs20/chapter/Quality-statement-1-Testing-for-Lynch-syndrome
    confirms: >
      MMR/MSI testing is recommended for everyone newly diagnosed with colorectal cancer.
      NICE QS20 statement 1 (verbatim): "Adults with a new diagnosis of colorectal cancer have
      testing for Lynch syndrome." ESMO colon CPG: MMR/MSI in the standard pathology report for
      all. NCCN: "Universal MMR or MSI testing is recommended in all patients with a personal
      history of colon or rectal cancer."
    evidence_type: guideline
    strength: guideline-recommended
    source_version: "NICE QS20 / DG27(HTG430); ESMO colon CPG 2020; NCCN Colon v3.2024"
    confidence: high
    verified_at: 2026-06-22
  - id: crc-mdt
    org: ESMO / NICE
    title: MDT (multidisciplinary team) discussion is standard
    url: https://www.nice.org.uk/guidance/ng151/chapter/Recommendations
    confirms: >
      ESMO rectal CPG 2025: "a dedicated multidisciplinary team ... should attend regular meetings
      to discuss patients [I, A]." NICE NG151 anchors management in the colorectal MDT.
    evidence_type: guideline
    strength: guideline-recommended
    source_version: "ESMO rectal CPG 2025; NICE NG151 (2020, updated)"
    confidence: high
    verified_at: 2026-06-22
  - id: crc-staging
    org: ESMO / NICE
    title: Baseline staging (CT chest/abdomen/pelvis + CEA; pelvic MRI for rectal)
    url: https://www.nice.org.uk/guidance/ng151/chapter/Recommendations
    confirms: >
      Staging usually includes CT chest/abdomen/pelvis and a baseline CEA blood test; rectal
      cancer additionally needs pelvic MRI (ESMO rectal: "MRI is mandatory ... [I, A]"; CT
      chest+abdomen [III, A]; CEA [III, A]). NICE NG151 pairs CT C/A/P with CEA.
    evidence_type: guideline
    strength: guideline-recommended
    source_version: "ESMO rectal CPG 2025; ESMO colon CPG 2020; NICE NG151"
    confidence: high     # exact 3-region CT baseline wording medium; CEA/MRI grades high
    verified_at: 2026-06-22
  - id: crc-ras-braf
    org: NCCN
    title: RAS (KRAS/NRAS) + BRAF genotyping in metastatic colorectal cancer
    url: https://jnccn.org/abstract/journals/jnccn/22/2D/article-e240029.xml
    confirms: >
      NCCN (verbatim): "All patients with metastatic colorectal cancer should have tumor tissue
      genotyped for RAS (KRAS and NRAS) and BRAF mutations." Anti-EGFR (cetuximab/panitumumab)
      benefit is confined to RAS wild-type tumours. (Used only if the synthetic case is metastatic.)
    evidence_type: guideline
    strength: guideline-recommended
    source_version: "NCCN Colon Cancer v3.2024 / v1.2025 (verbatim from v2.2017 mirror)"
    confidence: high     # live NCCN PDF bot-blocked; verbatim via mirror + 2024-25 corroboration
    verified_at: 2026-06-22

