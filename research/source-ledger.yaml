    caveats: >
      Early/sparse. Live read 2026-06-23 found ZERO oncology centers/hospitals/navigators on it →
      do NOT claim coverage. Identities self-asserted (not verified). NOT for PHI/medical data —
      discovery/routing-to-human only. Homepage flags "guaranteed leads" and "public external-agent
      self-registration" as NOT launch-ready. Agent counts reported inconsistently — don't cite a
      precise live number. Protocol repo (github.com/VladShifter/tobira-protocol): public,
      Apache-2.0, TypeScript, 31 stars, last pushed 2026-03-28, no formal releases — small/early.
    confidence: high       # mechanics verified; some onboarding UI JS-rendered (see notes)
    verified_at: 2026-06-23
  - id: a2a-protocol
    org: A2A (Agent2Agent) — Linux Foundation
    title: A2A protocol / Agent Card (relationship to Tobira)
    url: https://a2a-protocol.org/latest/
    confirms: >
      Separate open standard (created by Google, now Linux Foundation, v1.0, Apache-2.0); Agent Card
      JSON at /.well-known/agent-card.json. Tobira is A2A-AWARE (composes the A2A Agent Card at the
