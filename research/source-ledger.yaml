# Research register, not blanket clinical verification. Legacy verified_at/confidence fields
# record earlier research and may need passage-level rechecking. A 200 response only proves access.
# Current scoped checks ship with the skill in references/support/verified-sources.md.
# Do not cite a homepage or a model consensus as verification of a clinical recommendation.
# Oncoskill source ledger
# A research register: proposed support, source locations, past check dates, and reuse notes.
# Legacy entries do not imply a completed clinical-content audit.
#
# Rules embodied here:
#   - Verify before asserting; never invent names, doses, figures, versions.
#   - "MIT/Apache repo" is not enough — confirm the file is original and the bundled
#     assets are actually covered before reusing.
#   - Every clinical claim used in a pack must carry claim-metadata (see
#     skills/oncoskill/schemas/claim.schema.json) and a review_due date.
#
# verified_at dates are when an Oncoskill research/verification pass last checked the
# live page. Re-check time-sensitive items (guideline versions, contacts) before relying.

meta:
  last_updated: 2026-09-07
  notes: >
    Built from three research passes + one verification pass (all 2026-06-19). Items that a
    pass could not render directly (bot-blocked) are marked confidence: medium with the reason.

